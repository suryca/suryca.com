<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New message from suryca.com</title>
  </head>
  <body style="margin:0;padding:0;background:#fbf7f0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbf7f0;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">

            <!-- Brand -->
            <tr>
              <td style="padding:0 0 20px 0;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td width="28" style="width:28px;height:28px;border-radius:14px;background:#e2632a;"></td>
                    <td style="padding-left:10px;font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;color:#1c1712;letter-spacing:-0.01em;">Suryca</td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Eyebrow + title -->
            <tr>
              <td style="padding:0 0 18px 0;">
                <div style="font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#e2632a;">Contact form</div>
                <div style="font-family:'Space Grotesk',Helvetica,Arial,sans-serif;font-size:24px;font-weight:700;color:#1c1712;letter-spacing:-0.02em;line-height:1.2;margin-top:6px;">New message from {{{NAME}}}</div>
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td style="background:#ffffff;border:1px solid #ece3d4;border-radius:14px;padding:24px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-family:'Hanken Grotesk',-apple-system,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#1c1712;">
                  <tr>
                    <td style="padding:0 0 12px 0;width:80px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8073;vertical-align:top;">Topic</td>
                    <td style="padding:0 0 12px 0;vertical-align:top;">
                      <span style="display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(226,99,42,0.1);color:#e2632a;font-size:13px;font-weight:600;">{{{TOPIC}}}</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:0 0 12px 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8073;vertical-align:top;">Name</td>
                    <td style="padding:0 0 12px 0;vertical-align:top;">{{{NAME}}}</td>
                  </tr>
                  <tr>
                    <td style="padding:0 0 20px 0;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8073;vertical-align:top;">Email</td>
                    <td style="padding:0 0 20px 0;vertical-align:top;">
                      <a href="mailto:{{{SENDER_EMAIL}}}" style="color:#e2632a;text-decoration:none;">{{{SENDER_EMAIL}}}</a>
                    </td>
                  </tr>
                </table>
                <!-- Message sits outside the label/value table: the Resend editor drops colspan. -->
                <div style="margin-top:20px;padding-top:20px;border-top:1px solid #ece3d4;font-family:'Hanken Grotesk',-apple-system,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#1c1712;">
                  <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#8a8073;margin-bottom:8px;">Message</div>
                  <div style="background:#fbf7f0;border-radius:10px;padding:16px;white-space:pre-wrap;word-break:break-word;color:#3a322a;">{{{MESSAGE}}}</div>
                </div>
              </td>
            </tr>

            <!-- Reply note (plain text so the auto-generated text version stays clean) -->
            <tr>
              <td style="padding:20px 0 0 0;font-family:'Hanken Grotesk',-apple-system,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;color:#1c1712;">Reply to this email to answer {{{NAME}}} directly.</td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:28px 0 0 0;font-family:'Hanken Grotesk',-apple-system,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#8a8073;">
                Sent from the contact form at <a href="https://suryca.com/contact" style="color:#8a8073;text-decoration:underline;">suryca.com</a>.<br />
                Suryca Software Inc. &middot; Always on, like the sun.
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
